name: Build the apps

# Reusable: builds Urushi.app for Apple Silicon, the Android APK and the unsigned iOS .ipa
# (and, on request, the zipped iOS Simulator app), checks each one, and uploads them with
# their .sha256 files as workflow artifacts. The Build workflow calls it on every merge to
# main; the Release workflow calls it and publishes what it uploads.
# See docs/features/ci-and-releases.md and ADRs 0032, 0040, 0045 and 0053.

on:
  workflow_call:
    inputs:
      release:
        description: >-
          Build for a release: the APK must be signed with the release key, and the files
          are named Urushi-X.Y.Z-… (otherwise Urushi-X.Y.Z-<commit>-…, debug-signed APK).
        type: boolean
        default: false
      simulator:
        description: Also build and upload the zipped iOS Simulator app.
        type: boolean
        default: false
      retention-days:
        description: How long the uploaded artifacts are kept.
        type: number
        default: 30
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      version:
        description: The version in Cargo.toml.
        value: ${{ jobs.version.outputs.version }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stem: ${{ steps.version.outputs.stem }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
          # On pull requests github.sha is the temporary merge commit; name files after the
          # branch's own commit instead.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$RELEASE" = true ]; then
            stem="Urushi-$version"
          else
            stem="Urushi-$version-${COMMIT::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "Building $stem"

  macos:
    name: macOS (arm64)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ZIP: ${{ needs.version.outputs.stem }}-macos-arm64.zip
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Build Urushi.app
        run: ./scripts/bundle-macos.sh

      - name: Check the bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app=build/Urushi.app
          test -x "$app/Contents/MacOS/Urushi"
          test -x "$app/Contents/MacOS/urushid"
          test -x "$app/Contents/Resources/bin/urushi"
          lipo -archs "$app/Contents/MacOS/Urushi" | grep -qx arm64
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$app"

      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Urushi.app "dist/$ZIP"
          (cd dist && shasum -a 256 "$ZIP" > "$ZIP.sha256")
          cat "dist/$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: dist/*
          retention-days: ${{ inputs.retention-days }}

  android:
    name: Android (arm64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APK: ${{ needs.version.outputs.stem }}-android-arm64.apk
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Release key
        # Only releases get the release key; every other build is signed with a throwaway
        # debug key, so nothing but a release can install over a released app.
        if: inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 secret isn't set, so the APK can't be signed with the release key (see docs/features/ci-and-releases.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android.sh

      - name: Check the APK
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk=build/android/urushi.apk
          "$tools/aapt2" dump badging "$apk" | head -1 | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/liburushi.so'
          "$tools/apksigner" verify --print-certs "$apk"

      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp build/android/urushi.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          cat "dist/$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: dist/*
          retention-days: ${{ inputs.retention-days }}

  # Unsigned: there's no paid Apple Developer account, so users re-sign it with their own
  # Apple ID to install it (ADR 0045; the release notes explain how).
  ios:
    name: iOS (arm64, unsigned)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IPA: ${{ needs.version.outputs.stem }}-ios-arm64-unsigned.ipa
      SIM_ZIP: ${{ needs.version.outputs.stem }}-ios-simulator.zip
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Build Urushi.ipa
        run: ./scripts/bundle-ios.sh --device

      - name: Check the .ipa
        run: |
          dir="$RUNNER_TEMP/ipa"
          rm -rf "$dir" && mkdir -p "$dir"
          unzip -q build/ios/Urushi.ipa -d "$dir"
          app="$dir/Payload/Urushi.app"
          test -x "$app/Urushi"
          lipo -archs "$app/Urushi" | grep -qx arm64
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = app.urushi.Urushi

      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp build/ios/Urushi.ipa "dist/$IPA"
          (cd dist && shasum -a 256 "$IPA" > "$IPA.sha256")
          cat "dist/$IPA.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: dist/*
          retention-days: ${{ inputs.retention-days }}

      # For developers: drag the unzipped app onto a booted Simulator. Never released.
      - name: Build the Simulator app
        if: inputs.simulator
        run: |
          ./scripts/bundle-ios.sh
          mkdir -p sim
          ditto -c -k --keepParent build/ios-sim/Urushi.app "sim/$SIM_ZIP"

      - uses: actions/upload-artifact@v4
        if: inputs.simulator
        with:
          name: ${{ env.SIM_ZIP }}
          path: sim/*
          retention-days: ${{ inputs.retention-days }}
