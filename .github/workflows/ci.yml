name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding a runner for GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets --no-fail-fast
      - run: cargo test --workspace --doc

  # Builds the iOS app twice: for the Simulator (zipped .app, to try on a Mac) and for
  # devices (an UNSIGNED .ipa; re-sign it with an Apple ID to install, see
  # docs/platforms.md). Pull requests only: on main, the Build workflow (build.yml) builds
  # every app.
  ios:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/bundle-ios.sh
      - run: ./scripts/bundle-ios.sh --device
      - run: ditto -c -k --keepParent build/ios-sim/Urushi.app build/Urushi-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: urushi-ios-unsigned
          path: build/ios/Urushi.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: urushi-ios-simulator
          path: build/Urushi-ios-simulator.zip
          retention-days: 14

  # Builds the real APK (the runner image ships the Android SDK, NDK and a JDK), so a broken
  # Android build or packaging step fails the pull request rather than the next release.
  # Signed with a throwaway debug key; download it from the run's artifacts to try it.
  # Pull requests only, like `ios`.
  android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: urushi-android-debug
          path: build/android/urushi.apk
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-docs.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main
          push: false
          # The workflow token can't comment on pull requests; failures show in the log.
          pr_comment: false
