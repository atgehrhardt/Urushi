name: Advisories

# Checks the locked dependencies against the RustSec advisory database every week, so a
# vulnerability found in a crate we already use shows up without waiting for the next
# push (CI's cargo-deny job checks them on every push too). Runs by hand as well.
# See docs/security.md.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
