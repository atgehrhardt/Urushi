name: Release

# Pushing a tag vX.Y.Z (matching [workspace.package].version in Cargo.toml) builds
# Urushi.app for Apple Silicon and the Android APK, and publishes both as one GitHub
# Release. Running the workflow by hand, or a pull request that changes how releases are
# built, builds the same files as workflow artifacts and publishes nothing (a dry run).
# See docs/features/ci-and-releases.md and ADRs 0032 and 0040.
#
# The APK is signed with the release key from these repository secrets:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password (optional; defaults to the keystore's)
# A tag release fails without them. Pull requests never get the release key: their dry
# runs are signed with a throwaway debug key.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle-macos.sh
      - scripts/build-android.sh
      - apps/android/AndroidManifest.xml

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$IS_TAG" = true ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match Cargo.toml's version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (arm64)
    needs: version
    runs-on: macos-latest
    env:
      ZIP: Urushi-${{ needs.version.outputs.version }}-macos-arm64.zip
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Build Urushi.app
        run: ./scripts/bundle-macos.sh

      - name: Check the bundle
        run: |
          app=build/Urushi.app
          test -x "$app/Contents/MacOS/Urushi"
          test -x "$app/Contents/MacOS/urushid"
          test -x "$app/Contents/Resources/bin/urushi"
          lipo -archs "$app/Contents/MacOS/Urushi" | grep -qx arm64
          codesign --verify --deep --strict "$app"

      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Urushi.app "dist/$ZIP"
          (cd dist && shasum -a 256 "$ZIP" > "$ZIP.sha256")
          cat "dist/$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: dist/*

  android:
    name: Android (arm64)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APK: Urushi-${{ needs.version.outputs.version }}-android-arm64.apk
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Release key
        # Tags and manual runs (people with write access) use the release key; pull
        # requests don't, so a branch can't get a release-signed APK out of a dry run.
        if: github.event_name != 'pull_request'
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$IS_TAG" = true ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 secret isn't set, so the APK can't be signed with the release key (see docs/features/ci-and-releases.md)"
            exit 1
          else
            echo "::warning::no release key configured; signing with a throwaway debug key"
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android.sh

      - name: Check the APK
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk=build/android/urushi.apk
          "$tools/aapt2" dump badging "$apk" | head -1 | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/liburushi.so'
          "$tools/apksigner" verify --print-certs "$apk"

      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp build/android/urushi.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          cat "dist/$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: dist/*

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          cat > notes.md <<EOF
          Urushi $VERSION for Apple Silicon Macs (macOS 12 or later) and Android phones
          (Android 8 or later, arm64).

          **macOS:** unzip \`Urushi-$VERSION-macos-arm64.zip\`, then move \`Urushi.app\` to
          \`/Applications\`. The app is ad-hoc signed, not notarized, so macOS blocks the first
          launch. Allow it once with right-click → Open, or run:

              xattr -dr com.apple.quarantine /Applications/Urushi.app

          **CLI:** \`ln -s /Applications/Urushi.app/Contents/Resources/bin/urushi /usr/local/bin/urushi\`

          **Android:** install \`Urushi-$VERSION-android-arm64.apk\` (allow installs from your
          browser or file manager when asked). The app is a remote client: turn on
          Settings → Serve on my tailnet on your Mac, run Tailscale on the phone, and connect
          to the Mac's MagicDNS name.

          **Upgrading:** a running daemon keeps your sessions and the old version until it
          next starts (Settings → Restart daemon…, which ends all sessions).
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Urushi $VERSION" --notes-file notes.md --generate-notes
