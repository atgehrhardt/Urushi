name: Release

# Pushing a tag vX.Y.Z (matching [workspace.package].version in Cargo.toml) builds
# Urushi.app for Apple Silicon, the Android APK and the unsigned iOS .ipa (re-signed by
# each user to sideload it), and publishes them as one GitHub Release. Running the
# workflow by hand, or a pull request that changes how releases are built, builds the same
# files as workflow artifacts and publishes nothing (a dry run).
# See docs/features/ci-and-releases.md and ADRs 0032, 0040 and 0045.
#
# The APK is signed with the release key from these repository secrets:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password (optional; defaults to the keystore's)
# A tag release fails without them. Pull requests never get the release key: their dry
# runs are signed with a throwaway debug key.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle-macos.sh
      - scripts/build-android.sh
      - scripts/bundle-ios.sh
      - apps/android/AndroidManifest.xml

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$IS_TAG" = true ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match Cargo.toml's version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (arm64)
    needs: version
    runs-on: macos-latest
    env:
      ZIP: Urushi-${{ needs.version.outputs.version }}-macos-arm64.zip
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Build Urushi.app
        run: ./scripts/bundle-macos.sh

      - name: Check the bundle
        run: |
          app=build/Urushi.app
          test -x "$app/Contents/MacOS/Urushi"
          test -x "$app/Contents/MacOS/urushid"
          test -x "$app/Contents/Resources/bin/urushi"
          lipo -archs "$app/Contents/MacOS/Urushi" | grep -qx arm64
          codesign --verify --deep --strict "$app"

      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Urushi.app "dist/$ZIP"
          (cd dist && shasum -a 256 "$ZIP" > "$ZIP.sha256")
          cat "dist/$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: dist/*

  android:
    name: Android (arm64)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APK: Urushi-${{ needs.version.outputs.version }}-android-arm64.apk
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Release key
        # Tags and manual runs (people with write access) use the release key; pull
        # requests don't, so a branch can't get a release-signed APK out of a dry run.
        if: github.event_name != 'pull_request'
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$IS_TAG" = true ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 secret isn't set, so the APK can't be signed with the release key (see docs/features/ci-and-releases.md)"
            exit 1
          else
            echo "::warning::no release key configured; signing with a throwaway debug key"
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android.sh

      - name: Check the APK
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk=build/android/urushi.apk
          "$tools/aapt2" dump badging "$apk" | head -1 | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/liburushi.so'
          "$tools/apksigner" verify --print-certs "$apk"

      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp build/android/urushi.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          cat "dist/$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: dist/*

  # Unsigned: there's no paid Apple Developer account, so users re-sign it with their own
  # Apple ID to install it (ADR 0045; the release notes explain how).
  ios:
    name: iOS (arm64, unsigned)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IPA: Urushi-${{ needs.version.outputs.version }}-ios-arm64-unsigned.ipa
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Build Urushi.ipa
        run: ./scripts/bundle-ios.sh --device

      - name: Check the .ipa
        run: |
          dir="$RUNNER_TEMP/ipa"
          rm -rf "$dir" && mkdir -p "$dir"
          unzip -q build/ios/Urushi.ipa -d "$dir"
          app="$dir/Payload/Urushi.app"
          test -x "$app/Urushi"
          lipo -archs "$app/Urushi" | grep -qx arm64
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = app.urushi.Urushi

      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp build/ios/Urushi.ipa "dist/$IPA"
          (cd dist && shasum -a 256 "$IPA" > "$IPA.sha256")
          cat "dist/$IPA.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: dist/*

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, macos, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          cat > notes.md <<EOF
          Urushi $VERSION for Apple Silicon Macs (macOS 12 or later), Android phones
          (Android 8 or later, arm64), and iPhones and iPads (iOS 16 or later, sideloaded).

          **macOS:** unzip \`Urushi-$VERSION-macos-arm64.zip\`, then move \`Urushi.app\` to
          \`/Applications\`. The app is ad-hoc signed, not notarized, so macOS blocks the first
          launch. Allow it once with right-click → Open, or run:

              xattr -dr com.apple.quarantine /Applications/Urushi.app

          **CLI:** \`ln -s /Applications/Urushi.app/Contents/Resources/bin/urushi /usr/local/bin/urushi\`

          **Mobile apps** are remote clients. Turn on Settings → Serve on my tailnet on your
          Mac, run Tailscale on the phone, and connect to the Mac's MagicDNS name. Or turn on
          Settings → Allow LAN access, and pair the phone with the code the Mac shows.

          **Android:** install \`Urushi-$VERSION-android-arm64.apk\` (allow installs from your
          browser or file manager when asked).

          **iOS (sideloading):** \`Urushi-$VERSION-ios-arm64-unsigned.ipa\` is unsigned, because
          there's no App Store or TestFlight build yet, so an iPhone won't install it as it is.
          Sign and install it with your own Apple ID:

          1. On a Mac or PC, open a sideloading tool such as [Sideloadly](https://sideloadly.io)
             or [AltStore](https://altstore.io). Connect the iPhone by cable, choose the
             \`.ipa\`, and sign in with your Apple ID. (With a paid developer account, Xcode
             or any re-signing tool works too.)
          2. On the iPhone, trust your Apple ID: Settings → General → VPN & Device Management.
          3. Turn on Settings → Privacy & Security → Developer Mode and restart when asked
             (iOS 16 and later).

          With a free Apple ID, the signature expires after 7 days. Re-sign the app to keep
          using it (AltStore can refresh it automatically), and you can have at most 3
          sideloaded apps at a time. To upgrade, sideload the new \`.ipa\` with the same tool and
          Apple ID, so it installs over the old one and keeps your remembered hosts.

          **Upgrading:** a running daemon keeps your sessions and the old version until it
          next starts (Settings → Restart daemon…, which ends all sessions).
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Urushi $VERSION" --notes-file notes.md --generate-notes
