name: Release

# Started by hand: Actions → Release → Run workflow, on main. It releases the version in
# [workspace.package].version of Cargo.toml: it refuses a version that already has a tag
# and a commit whose CI hasn't passed, then builds Urushi.app for Apple Silicon, the
# Android APK and the unsigned iOS .ipa (re-signed by each user to sideload it) with the
# same reusable workflow as every merge's build, and publishes them as one GitHub Release,
# creating the tag vX.Y.Z on the commit it built.
# See docs/features/ci-and-releases.md and ADRs 0032, 0040, 0045 and 0053.
#
# The APK is signed with the release key from these repository secrets:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password (optional; defaults to the keystore's)
# A release fails without them.

on:
  workflow_dispatch:

# One release at a time; a second click waits, then finds the tag and stops.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the version and CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::releases are made from main, not $REF (choose main under Run workflow)"
            exit 1
          fi
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released; bump [workspace.package].version in Cargo.toml first"
            exit 1
          fi
          ci="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --event push --limit 1 --json status,conclusion \
            --jq 'if length == 0 then "no CI run" else .[0] | "\(.status) \(.conclusion)" end')"
          if [ "$ci" != "completed success" ]; then
            echo "::error::CI for ${SHA::7} hasn't passed ($ci); wait for it to go green, then run the release again"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from ${SHA::7}"

  build:
    needs: preflight
    uses: ./.github/workflows/build-apps.yml
    with:
      release: true
      simulator: false
      retention-days: 7
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    name: Publish the release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Urushi-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          ls -l dist
          cat > notes.md <<EOF
          Urushi $VERSION for Apple Silicon Macs (macOS 12 or later), Android phones
          (Android 8 or later, arm64), and iPhones and iPads (iOS 16 or later, sideloaded).

          **macOS:** unzip \`Urushi-$VERSION-macos-arm64.zip\`, then move \`Urushi.app\` to
          \`/Applications\`. The app is ad-hoc signed, not notarized, so macOS blocks the first
          launch. Allow it once with right-click → Open, or run:

              xattr -dr com.apple.quarantine /Applications/Urushi.app

          **CLI:** \`ln -s /Applications/Urushi.app/Contents/Resources/bin/urushi /usr/local/bin/urushi\`

          **Mobile apps** are remote clients. Turn on Settings → Serve on my tailnet on your
          Mac, run Tailscale on the phone, and connect to the Mac's MagicDNS name. Or turn on
          Settings → Allow LAN access, and pair the phone with the code the Mac shows.

          **Android:** install \`Urushi-$VERSION-android-arm64.apk\` (allow installs from your
          browser or file manager when asked).

          **iOS (sideloading):** \`Urushi-$VERSION-ios-arm64-unsigned.ipa\` is unsigned, because
          there's no App Store or TestFlight build yet, so an iPhone won't install it as it is.
          Sign and install it with your own Apple ID:

          1. On a Mac or PC, open a sideloading tool such as [Sideloadly](https://sideloadly.io)
             or [AltStore](https://altstore.io). Connect the iPhone by cable, choose the
             \`.ipa\`, and sign in with your Apple ID. (With a paid developer account, Xcode
             or any re-signing tool works too.)
          2. On the iPhone, trust your Apple ID: Settings → General → VPN & Device Management.
          3. Turn on Settings → Privacy & Security → Developer Mode and restart when asked
             (iOS 16 and later).

          With a free Apple ID, the signature expires after 7 days. Re-sign the app to keep
          using it (AltStore can refresh it automatically), and you can have at most 3
          sideloaded apps at a time. To upgrade, sideload the new \`.ipa\` with the same tool and
          Apple ID, so it installs over the old one and keeps your remembered hosts.

          **Upgrading:** a running daemon keeps your sessions and the old version until it
          next starts (Settings → Restart daemon…, which ends all sessions).
          EOF
          # Creates the tag vX.Y.Z on the commit that was built.
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Urushi $VERSION" --notes-file notes.md --generate-notes
