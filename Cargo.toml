[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
publish = false

# Every external dependency is declared here, once, so versions stay unified and
# each addition is reviewed against docs/dependencies.md (see the add-dependency skill).
[workspace.dependencies]
urushi-core = { path = "crates/urushi-core" }
urushi-proto = { path = "crates/urushi-proto" }
urushi-mux = { path = "crates/urushi-mux" }
urushi-daemon = { path = "crates/urushi-daemon" }
urushi-client = { path = "crates/urushi-client" }
urushi-ui = { path = "crates/urushi-ui" }
urushi-render = { path = "crates/urushi-render" }
urushi-app = { path = "crates/urushi-app" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1.18", default-features = false, features = ["serde", "std"] }
prost = "0.14"
tokio = { version = "1.47", default-features = false }
alacritty_terminal = "0.26"
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1"
# Exact command lines and working directories of pane processes (daemon restore points).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# Decoding attached images into thumbnails (daemon only; ADR 0016).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# LAN access (ADR 0041): Noise channels with pure-Rust crypto, randomness, interface addresses.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
getrandom = { version = "0.3", default-features = false }
if-addrs = "0.15"

# GUI
winit = "0.30"
wgpu = "30"
cosmic-text = "0.19"
accesskit = "0.25"
accesskit_winit = "0.34"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
arboard = { version = "3", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }  # never "gtk3" (LGPL)
notify-rust = { version = "4.19", default-features = false, features = ["z"] }  # "z" = pure-Rust D-Bus on Linux; never "d" (libdbus)

# build-only
prost-build = "0.14"
protox = "0.10"

# dev-only
proptest = "1.7"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"            # opt in per module with #[allow(unsafe_code)] + `// SAFETY:` comments
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
# Pedantic lints we deliberately do not enforce:
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Errors are typed enums whose variants document each failure; per-fn "# Errors" prose would duplicate them.
missing_errors_doc = "allow"
# Colours are written as 0xRRGGBB; separators would make them harder to read.
unreadable_literal = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
