[package]
name = "urushi-app"
description = "The Urushi GUI: sidebar of projects and threads, tabs, split terminal panes, dialogs and settings. Platform-neutral."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = { workspace = true }
urushi-client = { workspace = true }
urushi-core = { workspace = true }
urushi-proto = { workspace = true }
urushi-render = { workspace = true }
urushi-ui = { workspace = true }
winit = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
arboard = { workspace = true }
rfd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
