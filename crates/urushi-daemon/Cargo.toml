[package]
name = "urushi-daemon"
description = "urushid: Urushi's background service. Owns workspaces, terminal sessions, git worktrees and remote access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "urushid"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
if-addrs = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
urushi-core = { workspace = true }
urushi-mux = { workspace = true }
urushi-proto = { workspace = true, features = ["io", "lan"] }
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
urushi-client = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true }

[lints]
workspace = true
