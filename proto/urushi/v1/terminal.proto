// Terminal screens and input. The daemon owns emulation; clients render cells.
syntax = "proto3";

package urushi.v1;

message AttachPaneRequest {
  string pane_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message DetachPaneRequest {
  string pane_id = 1;
}

message SetPaneSizeRequest {
  string pane_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// Screen content. `full` replaces everything; otherwise only `lines` changed.
// The client must send AckScreen{seq} before the daemon sends the next update.
message ScreenUpdate {
  string pane_id = 1;
  uint64 seq = 2;
  bool full = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  repeated ScreenLine lines = 6;
  Cursor cursor = 7;
  TerminalModes modes = 8;
  string title = 9;
  // Lines scrolled back from the bottom (0 = live view).
  uint32 display_offset = 10;
  uint32 history_size = 11;
}

message ScreenLine {
  uint32 index = 1;
  repeated Span spans = 2;
}

// A run of cells with the same style. With STYLE_FLAG_WIDE every character
// occupies two columns; otherwise one.
message Span {
  string text = 1;
  Style style = 2;
}

message Style {
  Color fg = 1;
  Color bg = 2;
  // Bitwise OR of StyleFlag values.
  uint32 flags = 3;
}

enum StyleFlag {
  STYLE_FLAG_UNSPECIFIED = 0;
  STYLE_FLAG_BOLD = 1;
  STYLE_FLAG_ITALIC = 2;
  STYLE_FLAG_UNDERLINE = 4;
  STYLE_FLAG_INVERSE = 8;
  STYLE_FLAG_DIM = 16;
  STYLE_FLAG_STRIKETHROUGH = 32;
  STYLE_FLAG_WIDE = 64;
  STYLE_FLAG_HIDDEN = 128;
}

// Unset means the theme's default foreground/background.
message Color {
  oneof kind {
    // 0-255 palette index (0-15 are the theme's ANSI colors).
    uint32 indexed = 1;
    // 0xRRGGBB.
    uint32 rgb = 2;
  }
}

enum CursorShape {
  CURSOR_SHAPE_UNSPECIFIED = 0;
  CURSOR_SHAPE_BLOCK = 1;
  CURSOR_SHAPE_UNDERLINE = 2;
  CURSOR_SHAPE_BAR = 3;
}

message Cursor {
  uint32 line = 1;
  uint32 col = 2;
  bool visible = 3;
  CursorShape shape = 4;
}

message TerminalModes {
  bool app_cursor = 1;
  bool bracketed_paste = 2;
  bool mouse_reporting = 3;
  bool alt_screen = 4;
}

message AckScreen {
  string pane_id = 1;
  uint64 seq = 2;
}

message Input {
  string pane_id = 1;
  oneof kind {
    KeyInput key = 2;
    // Typed text (IME commits, character keys without modifiers).
    string text = 3;
    // Clipboard paste; wrapped in bracketed-paste markers when the app asks for it.
    string paste = 4;
  }
}

enum Key {
  KEY_UNSPECIFIED = 0;
  // A printable key; the character is in KeyInput.text.
  KEY_CHARACTER = 1;
  KEY_ENTER = 2;
  KEY_TAB = 3;
  KEY_BACKSPACE = 4;
  KEY_ESCAPE = 5;
  KEY_UP = 6;
  KEY_DOWN = 7;
  KEY_LEFT = 8;
  KEY_RIGHT = 9;
  KEY_HOME = 10;
  KEY_END = 11;
  KEY_PAGE_UP = 12;
  KEY_PAGE_DOWN = 13;
  KEY_INSERT = 14;
  KEY_DELETE = 15;
  KEY_F1 = 16;
  KEY_F2 = 17;
  KEY_F3 = 18;
  KEY_F4 = 19;
  KEY_F5 = 20;
  KEY_F6 = 21;
  KEY_F7 = 22;
  KEY_F8 = 23;
  KEY_F9 = 24;
  KEY_F10 = 25;
  KEY_F11 = 26;
  KEY_F12 = 27;
  KEY_SPACE = 28;
}

enum Modifier {
  MODIFIER_UNSPECIFIED = 0;
  MODIFIER_SHIFT = 1;
  MODIFIER_CTRL = 2;
  MODIFIER_ALT = 4;
  MODIFIER_SUPER = 8;
}

message KeyInput {
  Key key = 1;
  string text = 2;
  // Bitwise OR of Modifier values.
  uint32 modifiers = 3;
}

message ScrollPane {
  string pane_id = 1;
  // Positive scrolls back into history, negative towards the live view.
  int32 lines = 2;
  // Jump straight back to the live view.
  bool to_bottom = 3;
}

message PaneExited {
  string pane_id = 1;
  int32 exit_code = 2;
}

message PaneBell {
  string pane_id = 1;
}

// Plain text of the visible screen; used by the CLI and tests.
message ReadScreenTextRequest {
  string pane_id = 1;
}

message ScreenText {
  repeated string lines = 1;
}
