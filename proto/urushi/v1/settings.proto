// Settings stored by the daemon and shared by every client.
syntax = "proto3";

package urushi.v1;

import "urushi/v1/agents.proto";

message GetSettingsRequest {}

message Settings {
  bool delete_remote_branches = 1;
  string branch_prefix = 2;
  // Empty means the user's login shell.
  string default_shell = 3;
  // Empty means <data dir>/worktrees.
  string worktree_root = 4;
  TailnetSettings tailnet = 5;
  AgentSettings agents = 6;
  // How the app looks; unset from an older daemon (the original look). Since 1.13.
  Appearance appearance = 7;
  // Before making a new thread's worktree, fetch its base from the base's remote and
  // start from the newer commit (ADR 0028). Unset from an older daemon, which doesn't.
  // Since 1.16.
  bool update_base_from_remote = 8;
}

// How the app looks: the backdrop's colors and the accent, and the logo. Since 1.13.
message Appearance {
  ColorScheme scheme = 1;
  // The colors of COLOR_SCHEME_CUSTOM.
  SchemeColors custom = 2;
  LogoStyle logo = 3;
}

// Preset color schemes. Clients show values they don't know as the original.
enum ColorScheme {
  // The original (Urushi).
  COLOR_SCHEME_UNSPECIFIED = 0;
  COLOR_SCHEME_URUSHI = 1;
  COLOR_SCHEME_OCEAN = 2;
  COLOR_SCHEME_FOREST = 3;
  COLOR_SCHEME_DUSK = 4;
  COLOR_SCHEME_EMBER = 5;
  COLOR_SCHEME_MONO = 6;
  // Appearance.custom.
  COLOR_SCHEME_CUSTOM = 7;
}

// Colors as 0xRRGGBB.
message SchemeColors {
  uint32 background = 1;
  // Three glows: top left, bottom right, middle.
  repeated uint32 glows = 2;
  uint32 accent = 3;
}

// How the logo is drawn. Clients draw values they don't know as the original.
enum LogoStyle {
  LOGO_STYLE_UNSPECIFIED = 0;
  LOGO_STYLE_ORIGINAL = 1;
  // In the scheme's accent.
  LOGO_STYLE_ACCENT = 2;
  // In the text color.
  LOGO_STYLE_MONO = 3;
  LOGO_STYLE_HIDDEN = 4;
}

// How agent CLIs are started. Every flag defaults to off: agents ask before acting.
message AgentSettings {
  // Start Claude with --dangerously-skip-permissions.
  bool claude_skip_permissions = 1;
  // Start Codex with --dangerously-bypass-approvals-and-sandbox.
  bool codex_skip_permissions = 2;
  // Start Cursor with --force.
  bool cursor_skip_permissions = 3;
  // The agent a thread started from a task runs (CreateThreadRequest.start_task_agent).
  // Unspecified: none chosen yet. Since 1.7.
  Agent task_agent = 4;
  // The mode task_agent starts in. Since 1.7.
  AgentMode task_mode = 5;
  // Type the task's message into the task agent without sending it, for the user to
  // edit and send. False (the default): the agent starts with it as its first prompt.
  // Since 1.19.
  bool task_draft = 6;
  // Use task_message instead of the default message. Since 1.19.
  bool task_message_custom = 7;
  // The user's own task message. {key}, {title}, {url} and {show} are filled in per
  // task. Kept while task_message_custom is off. Since 1.19.
  string task_message = 8;
}

message TailnetSettings {
  bool serve = 1;
  uint32 port = 2;
  // Empty means only the host's own tailnet login.
  repeated string allowed_logins = 3;
  bool allow_tagged_nodes = 4;
}

// Unset fields are left unchanged.
message SettingsPatch {
  optional bool delete_remote_branches = 1;
  optional string branch_prefix = 2;
  optional string default_shell = 3;
  optional string worktree_root = 4;
  optional bool tailnet_serve = 5;
  optional uint32 tailnet_port = 6;
  // Replaces the allowlist when `set_allowed_logins` is true.
  bool set_allowed_logins = 7;
  repeated string allowed_logins = 8;
  optional bool allow_tagged_nodes = 9;
  optional bool claude_skip_permissions = 10;
  optional bool codex_skip_permissions = 11;
  optional bool cursor_skip_permissions = 12;
  // AGENT_UNSPECIFIED clears the choice. Since 1.7.
  optional Agent task_agent = 13;
  optional AgentMode task_mode = 14;
  // Replaces the appearance when set. Since 1.13.
  Appearance appearance = 15;
  // Since 1.16.
  optional bool update_base_from_remote = 16;
  // Since 1.19.
  optional bool task_draft = 17;
  optional bool task_message_custom = 18;
  optional string task_message = 19;
}

message UpdateSettingsRequest {
  SettingsPatch patch = 1;
}

// Per-project overrides; unset means "use the global value".
message ProjectSettings {
  optional bool delete_remote_branches = 1;
  optional string branch_prefix = 2;
  optional string default_shell = 3;
}

message UpdateProjectSettingsRequest {
  string project_id = 1;
  // Replaces all overrides.
  ProjectSettings settings = 2;
}
