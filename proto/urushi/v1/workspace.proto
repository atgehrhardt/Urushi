// Repos, projects (folders), threads, tabs and layouts.
//
// Naming: v1 field names are frozen (buf breaking uses WIRE_JSON). Fields and messages
// called "project" (`Project`, `projects`, `project_id`, `AddProjectRequest`, ...) are
// what users now call *repos*: git repositories. What users call *projects*, user-made
// groups of threads, are `Folder`s on the wire. See ADR 0010.
syntax = "proto3";

package urushi.v1;

import "urushi/v1/agents.proto";
import "urushi/v1/boards.proto";
import "urushi/v1/settings.proto";

message ListWorkspaceRequest {
  // Also stream WorkspaceChanged events on this connection.
  bool subscribe = 1;
}

message Workspace {
  // Increases on every change.
  uint64 revision = 1;
  // Repos (named before the rename; see the note at the top).
  repeated Project projects = 2;
  repeated Thread threads = 3;
  repeated Tab tabs = 4;
  // Projects, in display order. Since protocol 1.2.
  repeated Folder folders = 5;
  // Task boards, in tab order. Since protocol 1.5.
  repeated Board boards = 6;
}

// A user-made group of threads, shown to users as a "project". It can hold threads
// from any repo. Since protocol 1.2.
message Folder {
  string id = 1;
  string name = 2;
  int64 created_at_ms = 3;
  // Project settings. Since 1.18.
  FolderSettings settings = 4;
}

// A project's settings (ADR 0029). Since 1.18.
message FolderSettings {
  // The parent branch's repo (a `Project` on the wire). Empty: no parent branch.
  string base_repo_id = 1;
  // The parent branch: a local branch of that repo. In UpdateFolderSettingsRequest it
  // may also name a remote-tracking branch (`origin/x`); the daemon stores `x`.
  string base_branch = 2;
  // Keep a parent-branch thread pinned at the top of the project. Unset means on.
  optional bool base_thread = 3;
}

message Project {
  string id = 1;
  string name = 2;
  string repo_root = 3;
  // Empty means the repository's current HEAD.
  string default_base = 4;
  ProjectSettings settings = 5;
  int64 added_at_ms = 6;
}

enum ThreadState {
  THREAD_STATE_UNSPECIFIED = 0;
  THREAD_STATE_CREATING = 1;
  THREAD_STATE_READY = 2;
  THREAD_STATE_DELETING = 3;
  THREAD_STATE_DELETION_FAILED = 4;
}

message Thread {
  string id = 1;
  // The repo (see the note at the top).
  string project_id = 2;
  string title = 3;
  string slug = 4;
  string worktree_path = 5;
  string primary_branch = 6;
  string base_ref = 7;
  string base_commit = 8;
  int64 created_at_ms = 9;
  ThreadState state = 10;
  // Set when state is DELETION_FAILED.
  string failure_reason = 11;
  repeated string tab_ids = 12;
  // The folder (project) it is filed under; empty means ungrouped. Since 1.2.
  string folder_id = 13;
  // Listed first within its group. Since 1.2.
  bool pinned = 14;
  // User-chosen status label; empty means none. Since 1.2.
  string status = 15;
  // Its folder's (project's) parent-branch thread: it works on an existing branch and
  // owns none. Since 1.18.
  bool project_base = 16;
  // Runs in a checkout Urushi didn't create (e.g. the repo's own folder), which
  // closing the thread leaves alone. Only set with `project_base`. Since 1.18.
  bool attached_checkout = 17;
}

message Tab {
  string id = 1;
  string thread_id = 2;
  string title = 3;
  LayoutNode layout = 4;
  string focused_pane_id = 5;
  // Panes whose program finished or is waiting for the user, until someone looks or
  // types (not stored; lost when the daemon restarts). Since 1.9.
  repeated PaneAttention attention = 6;
}

// Why a pane wants the user. Ordered by urgency: WAITING outranks DONE.
enum AttentionKind {
  // Unknown (from a newer daemon); treat as WAITING.
  ATTENTION_KIND_UNSPECIFIED = 0;
  // An agent finished its response.
  ATTENTION_KIND_DONE = 1;
  // An agent (or any program, by bell or OSC 9/777 notification) waits for input.
  ATTENTION_KIND_WAITING = 2;
}

message PaneAttention {
  string pane_id = 1;
  AttentionKind kind = 2;
  // When it was raised. A new raise has a new time, so clients can tell it apart.
  int64 since_ms = 3;
}

// Clears the attention of these panes (the user is looking at them). Panes without
// attention, or that no longer exist, are ignored. Since 1.9.
message ClearAttentionRequest {
  repeated string pane_ids = 1;
}

enum Axis {
  AXIS_UNSPECIFIED = 0;
  // Side by side, left to right.
  AXIS_ROW = 1;
  // Stacked, top to bottom.
  AXIS_COLUMN = 2;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_LEFT = 1;
  DIRECTION_RIGHT = 2;
  DIRECTION_UP = 3;
  DIRECTION_DOWN = 4;
}

message LayoutNode {
  oneof kind {
    string pane_id = 1;
    LayoutSplit split = 2;
  }
}

message LayoutSplit {
  Axis axis = 1;
  repeated LayoutChild children = 2;
}

message LayoutChild {
  double ratio = 1;
  LayoutNode node = 2;
}

message AddProjectRequest {
  // Any path inside the repository on the daemon's machine.
  string path = 1;
  // Optional display name; defaults to the repository folder name.
  string name = 2;
}

message RemoveProjectRequest {
  string project_id = 1;
}

message ListBranchesRequest {
  string project_id = 1;
}

message Branches {
  repeated string branches = 1;
  // Branch checked out in the main working tree (empty if detached).
  string current = 2;
  // Remote-tracking branches, as `<remote>/<branch>` (e.g. `origin/feature`). Since 1.18.
  repeated string remote_branches = 3;
}

message CreateThreadRequest {
  string project_id = 1;
  string title = 2;
  // Ref to branch from; empty uses the project's default base.
  string base_ref = 3;
  // Name of the branch to create; empty generates `<prefix><slug>-<short id>`, or
  // (since 1.14) `<prefix><KEY>-<slug>-<short id>` for a task that is a Jira issue.
  // Must not exist yet.
  string branch = 4;
  // Create the thread with no tabs, so the client can let the user pick what to
  // run first (see CreateTabRequest.agent). Since protocol 1.1.
  bool skip_initial_tab = 5;
  // File the new thread under this folder (project). Empty: ungrouped. Since 1.2.
  string folder_id = 6;
  // Link the thread to this task on a board (Task.thread_id), or with subtask_id, to
  // that subtask of it (Subtask.thread_id; since 1.8 at any depth under task_id).
  // Empty: no link. Since 1.6.
  string task_id = 7;
  string subtask_id = 8;
  // Open the first tab running the user's task agent (Settings.agents.task_agent) in
  // its task mode, with the linked task or subtask as its first prompt. Requires
  // task_id; fails before any worktree exists if no task agent is chosen or it isn't
  // installed. Overrides skip_initial_tab. Since 1.7.
  bool start_task_agent = 9;
}

// Changes a thread's organization. Unset fields are left unchanged. Since 1.2.
message UpdateThreadRequest {
  string thread_id = 1;
  optional string title = 2;
  optional bool pinned = 3;
  // Empty clears the status.
  optional string status = 4;
  // Empty ungroups the thread.
  optional string folder_id = 5;
}

// Folders are shown to users as projects. Since protocol 1.2.
message CreateFolderRequest {
  string name = 1;
}

message RenameFolderRequest {
  string folder_id = 1;
  string name = 2;
}

// Deletes a folder. Its threads become ungrouped; nothing on disk changes.
message DeleteFolderRequest {
  string folder_id = 1;
}

// Replaces a folder's settings. Turning the parent-branch thread on (with a parent
// branch) creates it; a change that would need an existing one closed (switching it
// off, or another parent branch) is refused with FAILED_PRECONDITION: close it first
// with PlanThreadDeletion and DeleteThread, which also switches it off. Since 1.18.
message UpdateFolderSettingsRequest {
  string folder_id = 1;
  FolderSettings settings = 2;
}

// Moves a folder to `index` among the others (counted without it; clamped to the end).
// Folders are listed in this order. Since 1.11.
message MoveFolderRequest {
  string folder_id = 1;
  uint32 index = 2;
}

message RenameThreadRequest {
  string thread_id = 1;
  string title = 2;
}

message PlanThreadDeletionRequest {
  string thread_id = 1;
}

// Everything a thread deletion will destroy. Clients MUST show this to the user
// and get explicit confirmation before sending DeleteThreadRequest.
message DeletionPlan {
  string thread_id = 1;
  string worktree_path = 2;
  uint32 modified_files = 3;
  uint32 untracked_files = 4;
  uint32 unpushed_commits = 5;
  repeated string local_branches = 6;
  repeated RemoteBranch remote_branches = 7;
  uint32 running_panes = 8;
  bool delete_remote_branches = 9;
  // Opaque; echo back in DeleteThreadRequest. Rejected if anything changed.
  string token = 10;
  // Non-fatal issues discovered while planning (e.g. a remote could not be inspected).
  repeated string warnings = 11;
  // The thread runs in a checkout Urushi didn't create: `worktree_path` is kept, and
  // nothing on disk is removed. Since 1.18.
  bool keeps_worktree = 12;
}

message RemoteBranch {
  string remote = 1;
  string branch = 2;
}

message DeleteThreadRequest {
  string thread_id = 1;
  string token = 2;
}

message CreateTabRequest {
  string thread_id = 1;
  // Empty uses the agent's name, or "Terminal".
  string title = 2;
  // Agent CLI to start in the tab's shell. Unspecified opens a plain shell.
  // Since protocol 1.1; older daemons ignore it.
  Agent agent = 3;
  // Link the thread to this task on a board, or with subtask_id, to that subtask of it
  // (at any depth under task_id), as CreateThreadRequest does. A task linked to another
  // thread moves to this one. Empty: no link. Since 1.10.
  string task_id = 4;
  string subtask_id = 5;
  // Run the user's task agent in its task mode in the new tab, with the linked task or
  // subtask as its first prompt; overrides `agent`. Requires task_id. Fails before any
  // terminal starts if no task agent is chosen or it isn't installed. Since 1.10.
  bool start_task_agent = 6;
}

// Which agent CLIs are installed on the daemon's machine. Since protocol 1.1.
message ListAgentsRequest {}

message InstalledAgent {
  Agent agent = 1;
  // Where the executable was found, on the daemon's machine.
  string path = 2;
}

message Agents {
  // Only installed agents, in display order.
  repeated InstalledAgent agents = 1;
}

message CloseTabRequest {
  string tab_id = 1;
}

message RenameTabRequest {
  string tab_id = 1;
  string title = 2;
}

message SplitPaneRequest {
  string tab_id = 1;
  string pane_id = 2;
  Direction side = 3;
}

message PaneCreated {
  string tab_id = 1;
  string pane_id = 2;
}

message ClosePaneRequest {
  string tab_id = 1;
  string pane_id = 2;
}

message FocusPaneRequest {
  string tab_id = 1;
  string pane_id = 2;
}

message MoveDividerRequest {
  string tab_id = 1;
  string anchor_pane_id = 2;
  Axis axis = 3;
  // Fraction of the enclosing split, from its start.
  double position = 4;
}

message ResizePaneEdgeRequest {
  string tab_id = 1;
  string pane_id = 2;
  Direction side = 3;
  // Fraction of the enclosing split; negative shrinks.
  double amount = 4;
}

message EqualizeRequest {
  string tab_id = 1;
}
