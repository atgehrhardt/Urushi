// Jira Cloud: the daemon's sign-in, and importing Jira boards to follow (ADR 0020).
// The API token is sent once, in ConnectJira, and never sent back. Since protocol 1.12.
syntax = "proto3";

package urushi.v1;

// Signs the daemon in to a Jira Cloud site with an Atlassian account's email and API
// token, checking them with Jira first. Replaces any earlier sign-in. Answered with the
// JiraAccount; PERMISSION_DENIED if Jira refuses them, UNAVAILABLE if it can't be
// reached.
message ConnectJiraRequest {
  // E.g. "acme", "acme.atlassian.net" or "https://acme.atlassian.net".
  string site = 1;
  string email = 2;
  string api_token = 3;
}

// Answered with the JiraAccount.
message GetJiraAccountRequest {}

// Forgets the sign-in. Imported boards stay, but stop syncing until it is back.
message DisconnectJiraRequest {}

// Who the daemon is signed in to Jira as.
message JiraAccount {
  bool connected = 1;
  // The site's address, e.g. https://acme.atlassian.net.
  string site = 2;
  string email = 3;
  // The account's name in Jira.
  string display_name = 4;
  // Its Atlassian account id ("Only my issues"); empty from a sign-in made before
  // 1.13 until it is read again. Since 1.13.
  string account_id = 5;
}

// Lists the site's boards whose name contains `query` (all of them when empty), at
// most 50. Answered with JiraBoardList.
message ListJiraBoardsRequest {
  string query = 1;
}

message JiraBoardList {
  repeated JiraBoardInfo boards = 1;
}

message JiraBoardInfo {
  uint64 id = 1;
  string name = 2;
  bool scrum = 3;
  string project_key = 4;
  string project_name = 5;
  // The board that already follows it here; empty if none.
  string imported_board_id = 6;
}

// Makes a board that follows a Jira board, with its columns, and starts syncing its
// issues. Answered with the Board straight away; issues arrive with the next workspace
// change. Already imported boards are answered with the existing Board.
message ImportJiraBoardRequest {
  uint64 jira_board_id = 1;
}

// Syncs a Jira board now, completely. Answered once it is done (or failed).
message SyncBoardRequest {
  string board_id = 1;
}

// The issues of a Jira board that its quick filters (all of them) let through, as Jira
// evaluates them. Answered with JiraIssueIds. Since 1.13.
message QueryJiraFilterRequest {
  string board_id = 1;
  repeated uint64 quick_filter_ids = 2;
  // Quick filters Urushi keeps for the board (Board.quick_filters), by id. Since 1.23.
  repeated string kept_quick_filter_ids = 3;
}

// Jira issue ids (JiraIssue.id). Since 1.13.
message JiraIssueIds {
  repeated string ids = 1;
}

// The Jira board this connection shows (empty: none). The daemon reads a watched
// board every few seconds, and stops when the connection asks for another or closes.
// Answered with Empty. Since 1.13.
message WatchBoardRequest {
  string board_id = 1;
}
