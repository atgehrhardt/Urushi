// Task boards: kanban boards of tasks, kept by the daemon and mirrored to clients as
// part of the Workspace. Since protocol 1.5.
syntax = "proto3";

package urushi.v1;

// A kanban board: columns of tasks, in display order.
message Board {
  string id = 1;
  string name = 2;
  int64 created_at_ms = 3;
  repeated BoardColumn columns = 4;
  // Set when the board follows a Jira board (ADR 0020): its content comes from Jira,
  // and changes Jira owns (columns, its name, nesting, deleting issues, attachments)
  // are refused with FAILED_PRECONDITION. Since 1.12.
  JiraBoardSource jira = 5;
  // The epics its issues belong to, by key. Since 1.12; since 1.15 also every
  // epic shown as a card (ADR 0027).
  repeated Epic epics = 6;
  // Quick filters Urushi keeps for the board (ADR 0033): on a board of Urushi's own,
  // all of them; on a Jira board, only those Jira wouldn't take (its own are in
  // jira.quick_filters). Since 1.23.
  repeated QuickFilter quick_filters = 7;
}

// A named filter shown as a chip above a board, which turns on and off. Since 1.23.
message QuickFilter {
  string id = 1;
  string name = 2;
  QuickFilterRule rule = 3;
}

// What a quick filter lets through. On a Jira board, `jql` (Jira evaluates it with
// QueryJiraFilter); on a board of Urushi's own, tasks passing every criterion given:
// `search` in the title or notes (ignoring case), one of `kinds`, one of `tags`
// (ignoring case). Clients evaluate those themselves. Since 1.23.
message QuickFilterRule {
  string search = 1;
  repeated TaskKind kinds = 2;
  repeated string tags = 3;
  string jql = 4;
}

// One quick filter of a board: a Jira board's own, by Jira's id, or one Urushi keeps.
// Since 1.23.
message QuickFilterRef {
  oneof filter {
    uint64 jira_id = 1;
    string id = 2;
  }
}

// The Jira board a board follows. Since 1.12.
message JiraBoardSource {
  // The site's address, e.g. https://acme.atlassian.net.
  string site = 1;
  uint64 board_id = 2;
  // The board's name in Jira.
  string name = 3;
  // The project new issues are created in.
  string project_key = 4;
  // A scrum board shows its open sprints; a kanban board everything on it.
  bool scrum = 5;
  // When the board last matched Jira; 0 before the first sync.
  int64 synced_at_ms = 6;
  // Why the last sync failed; empty if it didn't.
  string error = 7;
  // Issues left out because the board was too big.
  uint32 dropped = 8;
  // The board's web page.
  string url = 9;
  // Its quick filters, as Jira shows them above the board; QueryJiraFilter evaluates
  // them. Since 1.13.
  repeated JiraQuickFilter quick_filters = 10;
  // The key of the Jira sign-in that syncs it (JiraAccount.key); empty for a board
  // imported before 1.29, which uses the sign-in for its site. Since 1.29.
  string account = 11;
}

// A Jira board's quick filter. Since 1.13.
message JiraQuickFilter {
  uint64 id = 1;
  string name = 2;
  // Its JQL. Since 1.23.
  string jql = 3;
}

// Something Jira names and identifies: a sprint, a component, a version. Since 1.13.
message JiraNamed {
  string id = 1;
  string name = 2;
}

// A Jira user. Since 1.13.
message JiraUser {
  // The Atlassian account id, which changes are made with.
  string account_id = 1;
  string name = 2;
}

// An epic that issues on a Jira board belong to. Not a card: issues name it by key.
// Since 1.12.
message Epic {
  string key = 1;
  string summary = 2;
  LabelColor color = 3;
  // Its web page.
  string url = 4;
}

// What sort of work a task is. Clients treat values they don't know as unspecified.
// Since 1.12.
enum TaskKind {
  // Not said.
  TASK_KIND_UNSPECIFIED = 0;
  TASK_KIND_TASK = 1;
  TASK_KIND_STORY = 2;
  TASK_KIND_BUG = 3;
  TASK_KIND_EPIC = 4;
  TASK_KIND_SUBTASK = 5;
}

// Which of Jira's status groups an issue's status is in. Since 1.12.
enum JiraStatusCategory {
  JIRA_STATUS_CATEGORY_UNSPECIFIED = 0;
  JIRA_STATUS_CATEGORY_TO_DO = 1;
  JIRA_STATUS_CATEGORY_IN_PROGRESS = 2;
  JIRA_STATUS_CATEGORY_DONE = 3;
}

// The Jira issue a task on a Jira board shows. Since 1.12.
message JiraIssue {
  // Its id in Jira.
  string id = 1;
  // E.g. PROJ-123.
  string key = 2;
  // Its web page.
  string url = 3;
  // Its type's name as the site calls it ("Story", "Bug", "Spike"…).
  string type_name = 4;
  string status_id = 5;
  string status = 6;
  JiraStatusCategory category = 7;
  // Display names; empty when unassigned or without a priority.
  string assignee = 8;
  string priority = 9;
  // The key of its epic; empty if none.
  string epic_key = 10;
  // False when the description was too long to show whole: the notes are read-only.
  bool notes_editable = 11;
  // The Jira id of its parent issue, for a subtask.
  string parent_id = 12;
  // Its place in the board's ranking; compares as text.
  string rank = 13;
  int64 updated_ms = 14;
  // Since 1.13:
  string type_id = 15;
  // The assignee's account id; empty when unassigned.
  string assignee_id = 16;
  // Unset when Jira doesn't say.
  JiraUser reporter = 17;
  string priority_id = 18;
  // YYYY-MM-DD; empty when not due.
  string due = 19;
  // The estimate (story points) as Jira shows it ("3", "0.5"); empty without one.
  string points = 20;
  // The (open) sprint it is in; unset when none.
  JiraNamed sprint = 21;
  repeated JiraNamed components = 22;
  repeated JiraNamed fix_versions = 23;
  // How many issues it is linked to.
  uint32 links = 24;
  // Its pull requests, from Jira's development info (ADR 0036). Read only while a
  // thread is linked to it, so empty otherwise. Since 1.22.
  repeated PullRequest pull_requests = 25;
}

// Where a pull request stands. Since 1.22.
enum PullRequestStatus {
  // Not known (or a status this client doesn't know).
  PULL_REQUEST_STATUS_UNSPECIFIED = 0;
  PULL_REQUEST_STATUS_OPEN = 1;
  PULL_REQUEST_STATUS_MERGED = 2;
  // Closed without merging.
  PULL_REQUEST_STATUS_DECLINED = 3;
}

// A pull request, as a Jira site's code-host integration reports it. Since 1.22.
message PullRequest {
  // An https:// URL.
  string url = 1;
  string title = 2;
  PullRequestStatus status = 3;
}

// One column of a board (e.g. "To do"), with its tasks top to bottom.
message BoardColumn {
  string id = 1;
  string name = 2;
  repeated Task tasks = 3;
  // Unspecified: no color. Since 1.8.
  LabelColor color = 4;
  // On a Jira board, the ids of the Jira statuses it shows. Since 1.12.
  repeated string jira_statuses = 5;
}

// A color from the board palette. Clients choose the shade for their theme, and treat
// values they don't know as no color. Since 1.8.
enum LabelColor {
  // No color.
  LABEL_COLOR_UNSPECIFIED = 0;
  LABEL_COLOR_RED = 1;
  LABEL_COLOR_ORANGE = 2;
  LABEL_COLOR_YELLOW = 3;
  LABEL_COLOR_GREEN = 4;
  LABEL_COLOR_TEAL = 5;
  LABEL_COLOR_BLUE = 6;
  LABEL_COLOR_PURPLE = 7;
  LABEL_COLOR_PINK = 8;
  LABEL_COLOR_GRAY = 9;
}

// A task's tags, as one value, so a request can tell "keep the tags" (unset) from "no
// tags" (empty). Since 1.8.
message TagList {
  repeated string tags = 1;
}

message Task {
  string id = 1;
  string title = 2;
  // Free-form notes; may be empty.
  string notes = 3;
  int64 created_at_ms = 4;
  // Smaller steps, in order: tasks nested in this one (ADR 0015). Since 1.6.
  repeated Subtask subtasks = 5;
  // The thread started for this task; empty if none. It may no longer exist. Since 1.6.
  string thread_id = 6;
  // Unspecified: no color. Since 1.8.
  LabelColor color = 7;
  // Free-text tags; a tag's color comes from its name. Since 1.8.
  repeated string tags = 8;
  // Files attached to it. Since 1.8.
  repeated Attachment attachments = 9;
  // Since 1.12.
  TaskKind kind = 10;
  // The Jira issue it shows, on a Jira board. Since 1.12.
  JiraIssue issue = 11;
  // The pull request linked to it (an https:// URL), on a local board; empty if none.
  // A Jira issue's are in `issue.pull_requests`. Since 1.22.
  string pr_url = 12;
}

// A task nested in another (ADR 0015). Since protocol 1.6 (as a checklist item: id,
// title, done, thread); the rest since 1.8. Its id is a task id: every task request
// takes it, and it keeps it when it moves onto the board.
message Subtask {
  string id = 1;
  string title = 2;
  bool done = 3;
  // The thread started for this subtask; empty if none. It may no longer exist.
  string thread_id = 4;
  // Since 1.8.
  string notes = 5;
  int64 created_at_ms = 6;
  LabelColor color = 7;
  repeated string tags = 8;
  // Its own subtasks, in order.
  repeated Subtask subtasks = 9;
  repeated Attachment attachments = 10;
  // Since 1.12.
  TaskKind kind = 11;
  JiraIssue issue = 12;
  // As Task.pr_url. Since 1.22.
  string pr_url = 13;
}

// A file attached to a task (ADR 0016). The bytes stay in the daemon; fetch them with
// GetAttachment. Since 1.8.
message Attachment {
  string id = 1;
  // The file's name as attached (no directories).
  string name = 2;
  // From the contents: image/png, image/jpeg, image/gif, image/webp, application/pdf,
  // text/plain or application/octet-stream.
  string media_type = 3;
  uint64 size = 4;
  int64 created_at_ms = 5;
  // For an image, its size in pixels; 0 otherwise.
  uint32 width = 6;
  uint32 height = 7;
}

// Creates a board with the default columns (To do, In progress, Done).
message CreateBoardRequest {
  string name = 1;
}

message RenameBoardRequest {
  string board_id = 1;
  string name = 2;
}

// Deletes a board and every task on it.
message DeleteBoardRequest {
  string board_id = 1;
}

// Moves a board (manual or Jira) to `index` among the others (counted without it;
// clamped to the end). `Workspace.boards` is in this order, which is the order of the
// board tabs. NOT_FOUND for an unknown board. Nothing is sent to Jira. Since 1.17.
message MoveBoardRequest {
  string board_id = 1;
  uint32 index = 2;
}

// Adds a task at the bottom of a column. Answered with the Task. On a Jira board (1.12)
// this creates an issue of `kind` (a task when unspecified) in the board's project,
// moved to the column; subtasks, color and tags apply as usual.
message CreateTaskRequest {
  string board_id = 1;
  string column_id = 2;
  string title = 3;
  string notes = 4;
  // Titles of subtasks to create with it, in order. Since 1.6.
  repeated string subtasks = 5;
  // Since 1.8.
  LabelColor color = 6;
  repeated string tags = 7;
  // Since 1.12. On a Jira board, EPIC since 1.15 (ADR 0027; older daemons
  // refuse it, and so does any daemon for an epic with subtasks).
  TaskKind kind = 8;
  // On a Jira board, values for the new issue's other fields (from
  // GetJiraCreateFields; required ones must be given). Since 1.13.
  repeated JiraFieldEdit jira_fields = 9;
  // Subtasks to create with it with their details, in order, after those named in
  // `subtasks`. Since 1.14.
  repeated NewSubtask subtask_details = 10;
}

// A subtask to create, with what its editor sets (see CreateSubtaskRequest). Since
// 1.14.
message NewSubtask {
  string title = 1;
  string notes = 2;
  LabelColor color = 3;
  repeated string tags = 4;
  // Not on a Jira board, where every subtask is a Sub-task issue.
  TaskKind kind = 5;
  // On a Jira board, values for the new sub-task's other fields (from
  // GetJiraCreateFields with TASK_KIND_SUBTASK).
  repeated JiraFieldEdit jira_fields = 6;
}

// Since 1.13 (used with jira_issue.proto):
// A value Jira names: an option, a person, a sprint, an issue.
message JiraOption {
  string id = 1;
  string name = 2;
}

// A field's value: `text` for text-like kinds, `options` for the others. Empty clears
// the field.
message JiraFieldValue {
  string text = 1;
  repeated JiraOption options = 2;
}

// A new value for one field.
message JiraFieldEdit {
  string field_id = 1;
  JiraFieldValue value = 2;
}

message JiraFieldEdits {
  repeated JiraFieldEdit edits = 1;
}

// Changes a task's (or, since 1.8, a subtask's) text, color or tags. Unset fields are
// kept.
message UpdateTaskRequest {
  string task_id = 1;
  optional string title = 2;
  optional string notes = 3;
  // Set to LABEL_COLOR_UNSPECIFIED to clear the color. Since 1.8.
  optional LabelColor color = 4;
  // Replaces all the tags. Since 1.8.
  TagList tags = 5;
  // Set to TASK_KIND_UNSPECIFIED to clear it. Not on a Jira board, where Jira owns
  // an issue's type. Since 1.12.
  optional TaskKind kind = 6;
  // Links a pull request (an https:// URL); empty unlinks it. Not on a Jira board,
  // where Jira's development info names an issue's pull requests. Since 1.22.
  optional string pr_url = 7;
}

// Moves a task to `index` in a column of the same board (clamped; past the end means
// the bottom). On a Jira board (1.12) this transitions the issue to a status the column
// shows and ranks it there; FAILED_PRECONDITION when its workflow doesn't allow it. Since 1.8 the task may be a subtask: it comes out of its parent onto the
// board, unchecked.
message MoveTaskRequest {
  string task_id = 1;
  string column_id = 2;
  uint32 index = 3;
}

// Deletes a task (since 1.8 also a subtask of any depth) with its subtasks. Refused on
// a Jira board (FAILED_PRECONDITION): issues are deleted in Jira.
message DeleteTaskRequest {
  string task_id = 1;
}

// Adds a subtask at the end of a task's subtasks (since 1.8 the task may itself be a
// subtask). Answered with the Subtask. Since 1.6.
message CreateSubtaskRequest {
  string task_id = 1;
  string title = 2;
  // Its details, as on a new task. Since 1.14; older daemons create it with the
  // title only.
  string notes = 3;
  LabelColor color = 4;
  repeated string tags = 5;
  // Not on a Jira board, where every subtask is a Sub-task issue.
  TaskKind kind = 6;
  // On a Jira board, values for the new sub-task's other fields (from
  // GetJiraCreateFields with TASK_KIND_SUBTASK).
  repeated JiraFieldEdit jira_fields = 7;
}

// Renames and/or checks off a subtask. Unset fields are kept. Since 1.6.
message UpdateSubtaskRequest {
  string subtask_id = 1;
  optional string title = 2;
  optional bool done = 3;
}

// Since 1.6.
message DeleteSubtaskRequest {
  string subtask_id = 1;
}

// Adds an empty column at `index` (clamped; past the end means last). Answered with the
// BoardColumn. Since 1.8.
message CreateColumnRequest {
  string board_id = 1;
  string name = 2;
  uint32 index = 3;
}

// Renames and/or recolors a column. Unset fields are kept; LABEL_COLOR_UNSPECIFIED
// clears the color. Since 1.8.
message UpdateColumnRequest {
  string column_id = 1;
  optional string name = 2;
  optional LabelColor color = 3;
}

// Moves a column to `index` among the others (clamped). Since 1.8.
message MoveColumnRequest {
  string column_id = 1;
  uint32 index = 2;
}

// Removes a column. Its tasks move to the bottom of the column on its left (on its right
// for the first column). The last column can't be removed (FAILED_PRECONDITION).
// Since 1.8.
message DeleteColumnRequest {
  string column_id = 1;
}

// Moves a task (a card, or a subtask of any depth) under another task of the same board,
// at `index` of its subtasks (clamped). A card from the board's last column arrives
// checked off. Refused: the task's own subtree (INVALID_ARGUMENT), more than the
// nesting limits allow (INVALID_ARGUMENT). Since 1.8.
message NestTaskRequest {
  string task_id = 1;
  string parent_id = 2;
  uint32 index = 3;
}

// Attaches a file to a task (at any depth). At most 6 MiB, and 20 files per task
// (INVALID_ARGUMENT). An image the daemon can't decode is refused. Answered with the
// Attachment. Since 1.8.
message AddAttachmentRequest {
  string task_id = 1;
  string name = 2;
  bytes data = 3;
}

// Fetches an attachment: the file itself, or with `thumbnail`, an image scaled to fit
// 320 pixels as raw RGBA (FAILED_PRECONDITION for files that aren't images). Answered
// with AttachmentData. Since 1.8.
message GetAttachmentRequest {
  string attachment_id = 1;
  bool thumbnail = 2;
}

message AttachmentData {
  string attachment_id = 1;
  // The file's media type, or "image/x-rgba" for a thumbnail.
  string media_type = 2;
  bytes data = 3;
  // A thumbnail's size in pixels (data is width × height × 4 bytes); 0 for a file.
  uint32 width = 4;
  uint32 height = 5;
}

// Since 1.8.
message DeleteAttachmentRequest {
  string attachment_id = 1;
}
